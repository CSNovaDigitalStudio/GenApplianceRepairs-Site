<!DOCTYPE html>
<html>
<head>
<title>Website Analytics Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Inter, Arial;
background:#eef2f7;
padding:40px;
margin:0;
}

h1{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:white;
padding:25px;
border-radius:14px;
text-align:center;
box-shadow:0 12px 25px rgba(0,0,0,.08);
}

.big{
font-size:42px;
font-weight:800;
color:#2563eb;
margin-top:10px;
}

canvas{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 12px 25px rgba(0,0,0,.08);
}

.footer{
text-align:center;
margin-top:40px;
color:#64748b;
}
</style>
</head>

<body>

<h1>Website Performance Dashboard</h1>

<div class="grid">

<div class="card">
<div>Total Visits</div>
<div id="total" class="big">...</div>
</div>

<div class="card">
<div>Visits Today</div>
<div id="today" class="big">...</div>
</div>

<div class="card">
<div>This Month</div>
<div id="month" class="big">...</div>
</div>

<div class="card">
<div>This Year</div>
<div id="year" class="big">...</div>
</div>

</div>

<canvas id="pagesChart"></canvas>

<div class="footer">
Visitor statistics update automatically.
</div>

<script>

const site = "genjayden2026";

async function loadStats(){

/* TOTAL */
let total = await fetch(`https://api.countapi.xyz/get/${site}/total`)
.then(r=>r.json()).catch(()=>({value:0}));
document.getElementById("total").innerText = total.value || 0;

/* TODAY */
let todayKey = new Date().toISOString().slice(0,10);
let today = await fetch(`https://api.countapi.xyz/get/${site}/day-${todayKey}`)
.then(r=>r.json()).catch(()=>({value:0}));
document.getElementById("today").innerText = today.value || 0;

/* MONTH */
let monthKey = new Date().toISOString().slice(0,7);
let month = await fetch(`https://api.countapi.xyz/get/${site}/month-${monthKey}`)
.then(r=>r.json()).catch(()=>({value:0}));
document.getElementById("month").innerText = month.value || 0;

/* YEAR */
let yearKey = new Date().getFullYear();
let year = await fetch(`https://api.countapi.xyz/get/${site}/year-${yearKey}`)
.then(r=>r.json()).catch(()=>({value:0}));
document.getElementById("year").innerText = year.value || 0;

/* PAGE POPULARITY */
let pages = [
{file:"index.html",name:"Home"},
{file:"services.html",name:"Services"},
{file:"contact.html",name:"Contact"},
{file:"gallery.html",name:"Gallery"},
{file:"about.html",name:"About"},
{file:"areas.html",name:"Areas"},
{file:"coldroom.html",name:"Cold Rooms"}
];

let data = [];

for(let p of pages){
let res = await fetch(`https://api.countapi.xyz/get/${site}/page-${p.file}`)
.then(r=>r.json()).catch(()=>({value:0}));
data.push(res.value || 0);
}

new Chart(document.getElementById("pagesChart"),{
type:"bar",
data:{
labels:pages.map(p=>p.name),
datasets:[{
label:"Page Visits",
data:data
}]
}
});

}

loadStats();

</script>

</body>
</html>
